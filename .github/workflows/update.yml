name: Update payloads

on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours
  workflow_dispatch:          # "Run workflow" button
  push:
    paths:
      - sources.json          # re-run right away when you add a payload

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pull latest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add payloads_v2.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update payloads"
          git push
